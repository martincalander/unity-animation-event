name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-package:
    name: Validate and package
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.metadata.outputs.asset }}
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate extension source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath

          root = Path(".")
          manifest = json.loads((root / "package.json").read_text(encoding="utf-8"))

          expected = {
              "name": "unity-animation-event",
              "displayName": "Unity Animation Event",
              "publisher": "martincalander",
              "license": "MIT",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"package.json {key!r} must be {value!r}")

          version = manifest.get("version", "")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("package.json version must use MAJOR.MINOR.PATCH")

          contribution_paths = []
          for section in ("scripts", "keys"):
              entries = manifest.get("contributes", {}).get(section, [])
              if not entries:
                  raise SystemExit(f"package.json must contribute at least one {section} entry")
              for entry in entries:
                  raw_path = entry.get("path", "")
                  normalized = PurePosixPath(raw_path.removeprefix("./"))
                  if not raw_path or normalized.is_absolute() or ".." in normalized.parts:
                      raise SystemExit(f"unsafe contribution path: {raw_path!r}")
                  disk_path = root.joinpath(*normalized.parts)
                  if not disk_path.is_file():
                      raise SystemExit(f"missing contribution file: {raw_path}")
                  contribution_paths.append(disk_path)

          keys_path = root / "my_keys.aseprite-keys"
          keys_root = ET.parse(keys_path).getroot()
          shortcut_commands = {
              element.attrib["command"]
              for element in keys_root.findall(".//key")
              if "command" in element.attrib
          }
          if len(shortcut_commands) != 7:
              raise SystemExit("expected exactly seven shortcut command bindings")

          lua_source = (root / "celcolor.lua").read_text(encoding="utf-8")
          missing_commands = sorted(
              command for command in shortcut_commands if f'"{command}"' not in lua_source
          )
          if missing_commands:
              raise SystemExit(f"shortcut commands missing from Lua source: {missing_commands}")

          forbidden_names = {
              ".DS_Store",
              ".emmyrc.json",
              ".idea",
              "__info.json",
              "__pref.lua",
          }
          forbidden = [
              path
              for path in root.rglob("*")
              if ".git" not in path.parts
              and (
                  path.name in forbidden_names
                  or path.name.endswith(".aseprite-extension")
                  or path.name.startswith(".aem-")
              )
          ]
          if forbidden:
              raise SystemExit(f"forbidden repository files: {forbidden}")

          print(f"Validated Unity Animation Event {version}")
          print("Contribution files:", ", ".join(str(path) for path in contribution_paths))
          PY

      - name: Resolve package metadata
        id: metadata
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          asset="unity-animation-event-${version}.aseprite-extension"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Build deterministic extension archive
        id: package
        shell: bash
        env:
          ASSET: ${{ steps.metadata.outputs.asset }}
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output="dist/$ASSET" \
            "$GITHUB_SHA" \
            -- \
            CHANGELOG.md \
            LICENSE \
            README.md \
            celcolor.lua \
            my_keys.aseprite-keys \
            package.json

          ASSET_PATH="dist/$ASSET" python3 - <<'PY'
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          asset = Path(os.environ["ASSET_PATH"])
          expected = sorted(
              [
                  "CHANGELOG.md",
                  "LICENSE",
                  "README.md",
                  "celcolor.lua",
                  "my_keys.aseprite-keys",
                  "package.json",
              ]
          )

          with zipfile.ZipFile(asset) as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos]
              if names != expected:
                  raise SystemExit(f"unexpected archive entries: {names}")
              if len({name.casefold() for name in names}) != len(names):
                  raise SystemExit("archive contains duplicate or case-colliding paths")

              total_size = 0
              for info in infos:
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts or "\\" in info.filename:
                      raise SystemExit(f"unsafe archive path: {info.filename!r}")
                  if info.flag_bits & 0x1:
                      raise SystemExit(f"encrypted archive entry: {info.filename}")
                  mode = info.external_attr >> 16
                  if mode and stat.S_IFMT(mode) not in (0, stat.S_IFREG):
                      raise SystemExit(f"non-regular archive entry: {info.filename}")
                  total_size += info.file_size
                  if archive.read(info) != Path(info.filename).read_bytes():
                      raise SystemExit(f"archive content mismatch: {info.filename}")

              if total_size > 10 * 1024 * 1024:
                  raise SystemExit("extension archive is unexpectedly large")

              archived_manifest = json.loads(archive.read("package.json"))
              source_manifest = json.loads(Path("package.json").read_text(encoding="utf-8"))
              if archived_manifest != source_manifest:
                  raise SystemExit("archived manifest does not match source manifest")

          print(f"Validated archive: {asset}")
          PY

          sha256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Extension package"
            echo
            echo "- Asset: $ASSET"
            echo "- SHA-256: $sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-animation-event-${{ steps.metadata.outputs.version }}
          path: dist/${{ steps.metadata.outputs.asset }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated extension package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unity-animation-event-${{ needs.validate-package.outputs.version }}
          path: dist

      - name: Verify downloaded package
        shell: bash
        env:
          ASSET: ${{ needs.validate-package.outputs.asset }}
          EXPECTED_SHA256: ${{ needs.validate-package.outputs.sha256 }}
          VERSION: ${{ needs.validate-package.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION"
          actual_sha256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          test "$actual_sha256" = "$EXPECTED_SHA256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          ASSET: ${{ needs.validate-package.outputs.asset }}
          EXPECTED_SHA256: ${{ needs.validate-package.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-package.outputs.version }}
        run: |
          release_api="repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          if release_json=$(gh api "$release_api" 2>&1); then
            asset_digest=$(
              jq -r \
                --arg asset "$ASSET" \
                '.assets[] | select(.name == $asset) | .digest // empty' \
                <<< "$release_json"
            )

            if [[ -z "$asset_digest" ]]; then
              gh release upload \
                "$GITHUB_REF_NAME" \
                "dist/$ASSET" \
                --repo "$GITHUB_REPOSITORY"
            elif [[ "$asset_digest" == "sha256:$EXPECTED_SHA256" ]]; then
              echo "$ASSET is already published with the expected SHA-256."
            else
              echo "Refusing to replace immutable release asset $ASSET." >&2
              echo "Expected sha256:$EXPECTED_SHA256, found $asset_digest." >&2
              exit 1
            fi
          else
            if [[ "$release_json" != *"(HTTP 404)"* ]]; then
              echo "$release_json" >&2
              exit 1
            fi

            gh release create \
              "$GITHUB_REF_NAME" \
              "dist/$ASSET" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --title "Unity Animation Event $VERSION" \
              --verify-tag
          fi
